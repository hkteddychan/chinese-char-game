<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>📖 中文認字小遊戲</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { font-family:-apple-system,'PingFang HK','Microsoft JhengHei','Segoe UI',sans-serif;
         background:linear-gradient(160deg,#e8f4ff,#cfe9ff); color:#1a2a3a; overflow:hidden; }
  #app { max-width:560px; margin:0 auto; height:100vh; display:flex; flex-direction:column;
         background:linear-gradient(180deg,#f0f8ff,#dff0ff); box-shadow:0 0 40px rgba(0,60,120,.2); }
  header { padding:14px 18px; background:#fff; border-bottom:2px solid #4a9df8;
           display:flex; justify-content:space-between; align-items:center;
           font-size:15px; color:#333; z-index:5; }
  header .brand { font-weight:bold; color:#1b6dc2; font-size:17px; }
  main { flex:1; position:relative; overflow:hidden; }

  #start { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:18px; padding:28px; background:linear-gradient(160deg,#dff0ff,#cfe4ff); }
  #start h1 { font-size:34px; color:#1b6dc2; letter-spacing:2px; }
  #start .sub { color:#5a7799; font-size:15px; text-align:center; line-height:1.5; }
  .menu { display:flex; flex-direction:column; gap:12px; width:100%; max-width:360px; }
  .menu button { padding:15px 18px; font-size:16px; font-weight:bold; border:none; border-radius:14px;
                 cursor:pointer; color:#fff; box-shadow:0 4px 12px rgba(30,90,160,.25);
                 transition:.2s; text-align:left; line-height:1.4; }
  .menu button small { display:block; font-size:12px; font-weight:normal; opacity:.85; }
  .menu button:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(30,90,160,.35); }
  .menu button:active { transform:scale(.97); }
  .b1 { background:linear-gradient(90deg,#4a9df8,#2d7ff9); }
  .b2 { background:linear-gradient(90deg,#34c759,#28a745); }
  .b3 { background:linear-gradient(90deg,#ff9500,#ff7a00); }
  .levelsel { display:flex; gap:8px; margin-top:4px; width:100%; max-width:360px; }
  .levelsel button { padding:8px 12px; font-size:13px; border-radius:20px; font-weight:bold;
                     border:2px solid #4a9df8; background:#fff; color:#2d7ff9; cursor:pointer; flex:1; }
  .levelsel button.on { background:#4a9df8; color:#fff; }

  #game { position:absolute; inset:0; display:none; flex-direction:column; }
  #qcard { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;
           gap:14px; padding:18px; }
  #qtype { font-size:13px; color:#6b86a8; font-weight:bold; text-align:center; min-height:18px; }
  .playrow { display:flex; align-items:center; flex-direction:column; gap:6px; }
  #playBtn { width:62px; height:62px; border-radius:50%; border:none; font-size:28px;
             background:linear-gradient(135deg,#4a9df8,#2d7ff9); color:#fff;
             box-shadow:0 4px 14px rgba(40,120,220,.4); cursor:pointer;
             display:flex; align-items:center; justify-content:center; }
  #playBtn:active { transform:scale(.92); }
  #autoCount { font-size:12px; color:#8aa0b8; font-weight:bold; min-height:16px; }
  #big { font-size:42px; font-weight:bold; color:#1b3a5a; line-height:1.35; text-align:center;
         padding:14px 24px; border-radius:16px; background:#fff;
         box-shadow:0 6px 20px rgba(30,90,160,.18); min-height:100px;
         display:flex; align-items:center; justify-content:center; width:100%; }
  #big .b { display:inline-block; min-width:1.1em; border-bottom:3px solid #4a9df8;
            margin:0 3px; color:#2d7ff9; }
  #hint { font-size:13px; color:#94a7bd; min-height:18px; }
  #options { display:flex; flex-direction:column; gap:10px; width:100%; padding:0 18px 28px; }
  .opt { padding:14px 18px; font-size:24px; font-weight:bold;
         border:2px solid #bcd6f0; border-radius:14px; background:#fff; color:#1a3a5a;
         cursor:pointer; transition:.1s; text-align:center; }
  .opt:active { transform:scale(.96); }
  .opt.correct { background:#34c759; color:#fff; border-color:#28a745; }
  .opt.wrong { background:#ff3b30; color:#fff; border-color:#d9372e; }
  .opt .mark { font-size:18px; margin-left:8px; vertical-align:middle; }
  .overlay { position:absolute; inset:0; background:rgba(0,40,80,.55); backdrop-filter:blur(4px);
             display:none; align-items:center; justify-content:center; z-index:10; }
  .panel { background:#fff; border-radius:20px; padding:28px; text-align:center; max-width:340px;
           width:90%; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  .panel h2 { font-size:26px; }
  .panel .score { font-size:16px; color:#5a7799; margin:10px 0 18px; }
  .panel button { padding:14px 28px; font-size:16px; font-weight:bold; border:none;
                  border-radius:14px; background:linear-gradient(90deg,#4a9df8,#2d7ff9);
                  color:#fff; cursor:pointer; }
  .stars { font-size:44px; margin-bottom:8px; }
  #hudstats { display:flex; gap:16px; font-size:14px; font-weight:bold; }
  #hudstats .correct { color:#28a745; }
  #hudstats .wrong { color:#ff3b30; }
  .exbtn { position:absolute; top:14px; right:14px; z-index:6; background:rgba(255,255,255,.9);
           border:1px solid #bcd6f0; color:#1b6dc2; border-radius:20px; padding:6px 14px;
           font-weight:bold; cursor:pointer; font-size:14px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">📖 中文認字 <span id="modeName" style="font-size:13px;color:#6b86a8;font-weight:normal"></span></span>
    <span id="hudstats" style="display:none">
      <span class="correct" id="statC">✓ 0</span>
      <span class="wrong" id="statW">✗ 0</span>
    </span>
  </header>
  <main>
    <div id="start">
      <h1>📖 中文認字</h1>
      <div class="sub">聽住發音，揀啱答案 — 邊玩邊學</div>
      <div class="levelsel">
        <button data-lv="1" class="on">一年級</button>
        <button data-lv="2">二年級</button>
        <button data-lv="3">三年級</button>
        <button data-lv="0">全部</button>
      </div>
      <div class="menu">
        <button class="b1" data-mode="wordword">🔊 聽詞語選詞語<br><small>撳 ▶ 聽發音，揀出播緊嘅詞語</small></button>
        <button class="b2" data-mode="sentence">📖 聽句子選缺字<br><small>聽成句，揀返句中欠咗嘅字</small></button>
        <button class="b3" data-mode="charword">🔤 聽單字選缺字<br><small>聽單字發音，揀返缺咗嘅詞語</small></button>
      </div>
    </div>

    <div id="game">
      <div id="qcard">
        <div id="progressWrap">
          <div id="progressBar"><div id="progressFill"></div></div>
          <span id="qCounter">1/10</span>
        </div>
        <div id="qtype"></div>
        <div class="playrow">
          <button id="playBtn">▶️</button>
          <div id="autoCount"></div>
        </div>
        <div id="big"></div>
        <div id="hint"></div>
        <div id="options"></div>
      </div>
    </div>

    <div class="overlay" id="result">
      <div class="panel">
        <div class="stars" id="stars"></div>
        <h2 id="resTitle"></h2>
        <div class="score" id="resScore"></div>
        <button id="resBtns">再玩一次</button>
        <div style="margin-top:10px;display:flex;gap:10px;justify-content:center">
          <button id="resMenu" style="background:linear-gradient(90deg,#888,#666)">🏠 主選單</button>
        </div>
      </div>
    </div>
    <button class="exbtn" id="exit" style="display:none">✕ 退出</button>
    <!-- 用戶錄音鼓勵音效（完成時播放） -->
    <audio id="encourageAudio" preload="auto"></audio>
  </main>
</div>

<script src="wordbank/words.js"></script>
<script>
const lvNames={1:'一年級',2:'二年級',3:'三年級',0:'全部'};
let mode='wordword', level=1, correct=0, wrong=0, questionIdx=0;
let currentGen=null, autoTimer=null;

// 依 level 篩選字庫 — 用 c 字去重做 list
const UNIQUE={}; let usedChars=new Set();
(function(){
  for(let i=0;i<WORDBANK.length;i++){ const w=WORDBANK[i];
    if(!w.c) continue;
    let lv=1; if(i>49)lv=2; if(i>89)lv=3; if(i>139)lv=4;
    w.lv=lv;
    // 詞語支援: w.all 或 w.word
    if(!w.all){ w.all = w.word ? [w.word] : [w.c]; }
    if(!w.word && w.all.length) w.word = w.all[0];
    if(!UNIQUE[w.c]) UNIQUE[w.c]=w;
  }
})();
function pool(){ return Object.values(UNIQUE).filter(w=>level===0 || w.lv<=level); }

function shuffle(a){for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function randWord(o){ if(!o) return ""; const ws=(o.all&&o.all.length)?o.all.filter(x=>x.includes(o.c)):[]; if(ws.length) return ws[Math.floor(Math.random()*ws.length)]; if(o.word)return o.word; return o.c; }

const MODE_NAMES={wordword:'聽詞語選詞語',sentence:'聽句子選缺字',charword:'聽單字選缺字'};
let playBtn=document.getElementById('playBtn');
// ---- TTS (粵語優先) ----
let lang='zh-HK';
function tts(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang; u.rate=.8; u.pitch=1.05;
    const vs=speechSynthesis.getVoices();
    const v=vs.find(v=>v.lang==='zh-HK')||vs.find(v=>v.lang==='zh-CN')||vs.find(v=>v.lang&&v.lang.startsWith('zh'));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

// 揀「讀音相近」嘅字做干擾（答案難估）
function nearChar(w){
  const cands=pool().filter(o=>o.c!==w.c && o.all && o.all.length);
  const score=o=>{
    let s=0;
    if(o.py===w.py) s+=3; else if(o.py&&w.py&&o.py[0]===w.py[0]) s+=2;
    if(o.zy===w.zy) s+=3; else if(o.zy&&w.zy&&o.zy[0]===w.zy[0]) s+=2;
    if(o.jp===w.jp) s+=3; else if(o.jp&&w.jp&&o.jp.slice(0,2).replace(/\d/g,'')===w.jp.slice(0,2).replace(/\d/g,'')) s+=2;
    return s;
  };
  return cands.sort((a,b)=>score(b)-score(a));
}
function pickTarget(){
  // 漸進: 按題目號碼由簡單(lv小)到複雜(lv大)
  // 第1-2題 lv<=1, 3-5 lv<=2, 6-8 lv<=3, 9-10 全池(level內)
  const q = questionIdx;
  // level 選擇: 1=只lv1, 2=lv<=2, 3=lv<=3, 0=全部
  let segMax;
  if(q<=1) segMax=Math.min(maxlvFor(level), 1);
  else if(q<=4) segMax=Math.min(maxlvFor(level), 2);
  else if(q<=7) segMax=Math.min(maxlvFor(level), 3);
  else segMax=maxlvFor(level);
  const cands=shuffle(pool().filter(w=>
    !usedChars.has(w.c) && w.all && w.all.length && w.lv<=segMax
  ));
  let t=cands[0];
  if(!t){
    // 呢段用晒 → 放寬到全 level 池
    const rest=shuffle(pool().filter(w=>!usedChars.has(w.c) && w.all && w.all.length));
    if(rest.length===0){ usedChars.clear(); return pickTarget(); }
    t=rest[0];
  }
  usedChars.add(t.c);
  const ws=t.all.filter(x=>x.includes(t.c));
  t.word = ws[Math.floor(Math.random()*ws.length)] || t.all[0];
  return t;
}
function maxlvFor(level){ return level===0?4:level; }

// ---- 模式1: 聽詞語選詞語（四揀一） ----
function qWordWord(){
  const t=pickTarget();
  let opts=[t.word];
  // 干擾：讀音相近字嘅詞
  for(const s of nearChar(t)){
    if(opts.length>=4) break;
    const w=randWord(s);
    if(w && !opts.includes(w)) opts.push(w);
  }
  // 補夠 4 個
  for(const w of shuffle(pool())){
    if(opts.length>=4) break;
    const rw=randWord(w);
    if(rw && !opts.includes(rw)) opts.push(rw);
  }
  opts=shuffle(opts.slice(0,4));
  return {
    qtype:'🎧 聽一聽，邊個詞語啱？',
    audio:'『'+t.word+'』',
    display:'👇 揀出你聽到嘅詞語',
    options:opts, answer:t.word
  };
}

// ---- 模式2: 聽句子選缺字（四揀一） ----
const SENT_TEMPLATES=[
  (w)=>'我哋今日學到「'+w+'」呢個詞語。',
  (w)=>'你識唔識讀「'+w+'」？',
  (w)=>'老師教我寫「'+w+'」。',
  (w)=>'呢個字係「'+w+'」。',
  (w)=>'你知唔知道「'+w+'」？'
];
function qSentence(){
  const t=pickTarget();
  const word=t.word;
  // 遮 word 嘅第二個字（或只得一個字就遮佢），answer = 遮嘅字
  const blankIdx = word.length>=2 ? 1 : 0;
  const missing = word[blankIdx];
  const full = word.length>=2 ? word.slice(0,blankIdx)+'＿'+word.slice(blankIdx+1) : '＿';
  const say = word.length>=2 ? word.slice(0,blankIdx)+missing+word.slice(blankIdx+1) : missing;
  const tpl = SENT_TEMPLATES[Math.floor(Math.random()*SENT_TEMPLATES.length)];
  const dialog = tpl(full);        // 顯示:「我哋今日學到『中＿』呢個詞語。」
  const dialogSay = tpl(say);      // 讀:「…學到『中國』…」
  // 干擾字（讀音相近，去 missing）
  let sim=listSimChars(t).filter(x=>x!==missing).slice(0,3);
  const opts=shuffle([missing, ...sim]);
  // 若唔夠 4 個選項（池細時），補隨機字
  while(opts.length<4){
    const r=shuffle(pool().filter(w=>!opts.includes(w.c) && w.c!==missing))[0];
    if(!r) break;
    opts.push(r.c);
  }
  return {
    qtype:'🎧 聽句子，揀返欠咗嘅字',
    audio: dialogSay,
    display: dialog,
    options:opts, answer:missing
  };
}
function listSimChars(w){
  const r=nearChar(w).map(o=>o.c).filter(x=>x!==w.c);
  return r.slice(0,3);
}

// ---- 模式3: 聽單字選缺字（四揀一） ----
function qCharWord(){
  const t=pickTarget();
  const missing=t.c;
  const word=t.word;
  const pos=word.indexOf(missing);
  const show= pos>=0 ? word.slice(0,pos)+'＿'+word.slice(pos+1) : '＿'+word;
  // 干擾詞（用相近字嘅詞，且都缺字）— 去重
  const seen=new Set([show]);
  const distr=[];
  for(const s of nearChar(t)){
    if(distr.length>=3) break;
    const sw=randWord(s);
    if(!sw) continue;
    const sp=sw.indexOf(s.c);
    const masked = sp>=0 ? sw.slice(0,sp)+'＿'+sw.slice(sp+1) : '＿'+sw;
    if(!seen.has(masked) && masked!==show){ seen.add(masked); distr.push(masked); }
  }
  // 若唔夠 3 個干擾，用隨機詞補
  for(const w of shuffle(pool())){
    if(distr.length>=3) break;
    const sw=randWord(w);
    if(!sw) continue;
    const sp=sw.indexOf(w.c);
    const masked = sp>=0 ? sw.slice(0,sp)+'＿'+sw.slice(sp+1) : '＿'+sw;
    if(!seen.has(masked) && masked!==show){ seen.add(masked); distr.push(masked); }
  }
  const opts=shuffle([show, ...distr]);
  // 確保 4 個選項
  while(opts.length<4){
    const r=shuffle(pool().filter(w=>{
      const m=randWord(w); if(!m) return false;
      const sp=m.indexOf(w.c); const mm=sp>=0?m.slice(0,sp)+'＿'+m.slice(sp+1):'＿'+m;
      return !opts.includes(mm) && mm!==show;
    }))[0];
    if(!r) break;
    const m=randWord(r); const sp=m.indexOf(r.c);
    opts.push(sp>=0?m.slice(0,sp)+'＿'+m.slice(sp+1):'＿'+m);
  }
  return {
    qtype:'🎧 聽單字，邊個詞缺咗呢個字？',
    audio: missing,
    display: '👇 聽住單字發音，揀返缺咗『？』嘅詞語',
    options:opts, answer:show
  };
}

function gen(){
  if(mode==='wordword') return qWordWord();
  if(mode==='sentence') return qSentence();
  return qCharWord();
}

function renderDisplay(g){
  document.getElementById('qtype').textContent=g.qtype;
  // 高亮＿空格
  document.getElementById('big').innerHTML = g.display.replace(/＿/g,'<span class="b">＿</span>');
  document.getElementById('hint').textContent='';
  const box=document.getElementById('options'); box.innerHTML='';
  g.options.forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=o;
    b.onclick=()=>answerClick(b,o,g.answer);
    box.appendChild(b);
  });
}

// 撳大格仔重播
document.getElementById('big').addEventListener('click', ()=>playCurrent());

function playCurrent(){
  if(currentGen && currentGen.audio) tts(currentGen.audio);
}

function makeQ(){
  currentGen=gen();
  renderDisplay(currentGen);
  // 進度
  document.getElementById('qCounter').textContent=(correct+wrong+1)+'/10';
  document.getElementById('progressFill').style.width=((correct+wrong)/10*100)+'%';
  // 每題：可撳 play 或等 5 秒自動播
  clearInterval(autoTimer);
  startAutoCount(5);
  // 立即播一次
  playCurrent();
  playBtn.classList.add('pulsing');
}
function startAutoCount(n){
  let left=n;
  document.getElementById('autoCount').textContent='⏱ 下一次自動播放 '+left+'s';
  playBtn.classList.add('pulsing');
  autoTimer=setInterval(()=>{
    left--;
    if(left<=0){ clearInterval(autoTimer); document.getElementById('autoCount').textContent=''; playCurrent(); }
    else document.getElementById('autoCount').textContent='⏱ 下一次自動播放 '+left+'s';
  },1000);
}

function answerClick(el,val,ans){
  if(el.dataset.done) return;
  el.dataset.done='1';
  clearInterval(autoTimer);
  playBtn.classList.remove('pulsing');
  document.getElementById('autoCount').textContent='';
  const isC=val===ans;
  if(isC){correct++;el.classList.add('correct');
    // 喺 button 顯示 ✅ 標記
    el.insertAdjacentHTML('beforeend',' <span class="mark mark-ok">✅</span>');
    // pop animation
    const big=document.getElementById('big'); big.classList.remove('pop'); void big.offsetWidth; big.classList.add('pop');
  }
  else{wrong++;el.classList.add('wrong');
    // 喺 button 顯示 ❎ 標記
    el.insertAdjacentHTML('beforeend',' <span class="mark mark-no">❎</span>');
    const cs=[...el.parentNode.children].filter(b=>b.textContent===ans);
    if(cs[0]) cs[0].classList.add('correct');
    if(cs[0] && !cs[0].querySelector('.mark-ok')) cs[0].insertAdjacentHTML('beforeend',' <span class="mark mark-ok">✅</span>');
  }
  updateStats();
  // 防重複點擊：停用其他 options
  el.parentNode.querySelectorAll('.opt').forEach(b=>{ if(b!==el && !b.classList.contains('correct')) b.disabled=true; });
  setTimeout(nextQ, 1200);
}

function nextQ(){ questionIdx++; if(correct+wrong>=10){ finish(); } else { makeQ(); } }
function updateStats(){
  document.getElementById('statC').textContent='✓ '+correct;
  document.getElementById('statW').textContent='✗ '+wrong;
}
function playEncourage(pct){
  // 完成時按分數播用戶錄音
  var a=document.getElementById('encourageAudio');
  var src='assets/encourage_50.mp3';
  if(pct>=90) src='assets/encourage_100.mp3';
  else if(pct>=70) src='assets/encourage_90.mp3';
  else if(pct>=50) src='assets/encourage_70.mp3';
  a.src=src;
  try{ var p=a.play(); if(p&&p.catch) p.catch(function(){}); }catch(e){}
}
function finish(){
  clearInterval(autoTimer);
  playBtn.classList.remove('pulsing');
  document.getElementById('game').style.display='none';
  const total=correct+wrong;
  const pct=total?Math.round(correct/total*100):0;
  // 播用戶錄音鼓勵
  playEncourage(pct);
  let star=''; if(pct>=90)star='⭐⭐⭐';else if(pct>=70)star='⭐⭐';else if(pct>=50)star='⭐';else star='😊';
  document.getElementById('stars').textContent=star;
  document.getElementById('resTitle').textContent=pct>=80?'好犀利！':'繼續努力！';
  document.getElementById('resScore').textContent=`答啱 ${correct} 題 / 共 ${total} 題（${pct}%）`;
  document.getElementById('result').style.display='flex';
}
function startGame(m,lv){
  mode=m; level=lv; correct=0; wrong=0; questionIdx=0; usedChars.clear();
  document.getElementById('modeName').textContent='· '+MODE_NAMES[m] + (level>0?'（'+lvNames[level]+'）':'（全部）');
  document.getElementById('qCounter').textContent='1/10';
  document.getElementById('progressFill').style.width='0%';
  updateStats();
  document.getElementById('start').style.display='none';
  document.getElementById('game').style.display='flex';
  document.getElementById('hudstats').style.display='';
  document.getElementById('exit').style.display='';
  makeQ();
}
function exitGame(){
  clearInterval(autoTimer);
  playBtn.classList.remove('pulsing');
  document.getElementById('modeName').textContent='';
  document.getElementById('game').style.display='none';
  document.getElementById('hudstats').style.display='none';
  document.getElementById('exit').style.display='none';
  document.getElementById('start').style.display='flex';
  document.getElementById('result').style.display='none';
}

// 事件
document.getElementById('playBtn').onclick=playCurrent;
document.querySelector('.menu').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.mode) startGame(b.dataset.mode,level);
});
document.querySelectorAll('.levelsel button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.levelsel button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); level=+b.dataset.lv;
  };
});
document.getElementById('resBtns').onclick=()=>{ document.getElementById('result').style.display='none'; startGame(mode,level); };
document.getElementById('resMenu').onclick=exitGame;
document.getElementById('exit').onclick=exitGame;
</script>
</body>
</html>
